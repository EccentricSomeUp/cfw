name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  presets:
    name: ${{ matrix.preset }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [debug, release, sanitizers, shared, debug-tls]
        # macOS ships LibreSSL, which lacks OpenSSL 3 APIs used by
        # cfw_tls (e.g. SSL_get1_peer_certificate); TLS CI is
        # OpenSSL-only for now.
        exclude:
          - os: macos-latest
            preset: debug-tls
    steps:
      - uses: actions/checkout@v7

      - name: Configure ${{ matrix.preset }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build ${{ matrix.preset }}
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test ${{ matrix.preset }}
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # GitHub-hosted runners have no BSD image, so FreeBSD runs in a QEMU VM
  # via vmactions/freebsd-vm. Debug preset only: the goal is end-to-end
  # verification of the kqueue pollset backend (ADR 0052), not to multiply
  # runner time. The action syncs the checkout into the VM, runs `run`
  # under sh, and `prepare` installs packages with pkg(8).
  freebsd:
    name: freebsd debug (${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["14", "15"]
    steps:
      - uses: actions/checkout@v7

      - name: Configure, build, and test in FreeBSD ${{ matrix.release }}
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          copyback: false
          prepare: |
            pkg install -y cmake
          run: |
            cmake --preset debug
            cmake --build --preset debug
            ctest --preset debug --output-on-failure

  # Most of the suite is POSIX-gated and cannot run on Windows yet, but
  # the cfw_windows_smoke target (ADR 0072/0074) exercises the public
  # socket/pollset/server surface over loopback, so CI runs it here.
  windows:
    name: windows compile + smoke check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure debug
        run: cmake --preset debug

      - name: Build debug
        run: cmake --build --preset debug --config Debug

      - name: Run Windows smoke test
        run: ctest --preset debug -R cfw_windows_smoke --output-on-failure
