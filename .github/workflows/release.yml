name: release

on:
  push:
    # Final releases only: vMAJOR.MINOR.PATCH. Prerelease-style tags such as
    # v1.0.0-rc.1 are excluded so they cannot publish a GitHub release.
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "!v*-*"

permissions:
  contents: write

jobs:
  presets:
    name: ${{ matrix.preset }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [debug, release, sanitizers, shared, debug-tls]
        # macOS ships LibreSSL, which lacks OpenSSL 3 APIs used by
        # cfw_tls; TLS verification is OpenSSL-only for now.
        exclude:
          - os: macos-latest
            preset: debug-tls
    steps:
      - uses: actions/checkout@v4

      - name: Configure ${{ matrix.preset }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build ${{ matrix.preset }}
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test ${{ matrix.preset }}
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  package:
    name: package (${{ matrix.os }})
    needs: presets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure release
        run: cmake --preset release

      - name: Build release
        run: cmake --build --preset release

      - name: Test release
        run: ctest --preset release --output-on-failure

      - name: Install and package smoke test
        run: |
          cmake --install build/release --prefix "$RUNNER_TEMP/cfw-install"
          find "$RUNNER_TEMP/cfw-install" -name cfwConfig.cmake -print -quit \
            | grep -q .

      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix="cfw-${GITHUB_REF_NAME}/" \
            -o "cfw-${GITHUB_REF_NAME}-${{ matrix.os }}.tar.gz" HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: cfw-${{ github.ref_name }}-${{ matrix.os }}.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
