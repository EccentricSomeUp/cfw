name: release

on:
  push:
    # Final releases only: vMAJOR.MINOR.PATCH. Prerelease-style tags such as
    # v1.0.0-rc.1 are excluded so they cannot publish a GitHub release.
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "!v*-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  presets:
    name: ${{ matrix.preset }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [debug, release, sanitizers, shared, debug-tls]
        # macOS ships LibreSSL, which lacks OpenSSL 3 APIs used by
        # cfw_tls; TLS verification is OpenSSL-only for now.
        exclude:
          - os: macos-latest
            preset: debug-tls
    steps:
      - uses: actions/checkout@v7

      - name: Configure ${{ matrix.preset }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build ${{ matrix.preset }}
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test ${{ matrix.preset }}
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Install smoke test
        if: matrix.preset == 'release'
        run: |
          cmake --install build/release --prefix "$RUNNER_TEMP/cfw-install"
          find "$RUNNER_TEMP/cfw-install" -name cfwConfig.cmake -print -quit \
            | grep -q .

  release:
    name: release
    needs: presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
              index($0, "## [" version "] - ") == 1 { in_section = 1; next }
              in_section && /^## \[/ { exit }
              in_section { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          grep -q '[^[:space:]]' release-notes.md

      # gh is preinstalled on GitHub-hosted runners; using it directly
      # avoids a third-party release action in the supply chain.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
